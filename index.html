<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Famish.club</title>
  <meta name="description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Famish.club">
  <meta property="og:title" content="Famish.club">
  <meta property="og:description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Famish.club">
  <meta name="twitter:description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Game"></canvas>

  <main id="menu" hidden>
    <section class="menu-panel" aria-label="Join game">
      <header class="menu-header">
        <h1>Famish<span>.club</span></h1>
        <p>Fight enemy players and build bases</p>
      </header>
      <form id="join">
        <label for="nickname">Name</label>
        <input id="nickname" type="text" maxlength="10" placeholder="Your name" autocomplete="off" spellcheck="false" aria-label="Nickname">
        <label for="servers">Server</label>
        <select id="servers" aria-label="Server"></select>
        <button id="play" type="submit">Play</button>
      </form>
      <a id="discord" href="https://discord.gg/fCXtuPveN9" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M20.32 4.37A19.8 19.8 0 0 0 15.39 2.84a.07.07 0 0 0-.08.04c-.21.38-.45.87-.61 1.25a18.27 18.27 0 0 0-5.49 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.74 19.74 0 0 0-4.93 1.53.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.29 1.23-1.99a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1-.01.13c-.6.35-1.22.65-1.87.89a.08.08 0 0 0-.04.11c.36.7.78 1.36 1.23 1.99a.08.08 0 0 0 .08.03 19.84 19.84 0 0 0 6-3.03.08.08 0 0 0 .03-.05c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42s.96-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.16-1.09-2.16-2.42s.96-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.95 2.42-2.16 2.42Z"/></svg>
        <span>Discord</span>
      </a>
      <p id="status" role="status"></p>
    </section>
  </main>

  <form id="chat" hidden>
    <input id="chat-input" type="text" maxlength="50" autocomplete="off" spellcheck="false" placeholder="Say something…" aria-label="Chat message">
  </form>

  <div id="boot">Loading...</div>
  <div id="error" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
