<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Famish.club</title>
  <meta name="description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Famish.club">
  <meta property="og:title" content="Famish.club">
  <meta property="og:description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Famish.club">
  <meta name="twitter:description" content="A multiplayer 2D strategic fighting game. Gather loot, build your base, and outsmart your rivals.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Game"></canvas>

  <main id="menu" hidden>
    <section class="menu-panel" aria-label="Join game">
      <header class="menu-header">
        <h1>Famish.club</h1>
        <p>Fight other players.</p>
      </header>
      <form id="join">
        <label for="nickname">Name</label>
        <input id="nickname" type="text" maxlength="10" placeholder="Your name" autocomplete="off" spellcheck="false" aria-label="Nickname">
        <label for="servers">Server</label>
        <select id="servers" aria-label="Server"></select>
        <button id="play" type="submit">Play</button>
      </form>
      <p id="status" role="status"></p>
    </section>
  </main>

  <form id="chat" hidden>
    <input id="chat-input" type="text" maxlength="50" autocomplete="off" spellcheck="false" placeholder="Say something…" aria-label="Chat message">
  </form>

  <div id="boot">Loading...</div>
  <div id="error" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
